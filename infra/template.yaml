AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Realtime translation backend

Parameters:
  StageName:
    Type: String
    Default: dev
    MinLength: 1
  DraftProvider:
    Type: String
    Default: amazon-translate
    AllowedValues:
      - amazon-translate
  RefinerProvider:
    Type: String
    Default: amazon-bedrock
    AllowedValues:
      - amazon-bedrock
  BedrockModelId:
    Type: String
    MinLength: 1
  ContextWindowSize:
    Type: Number
    Default: 5
    MinValue: 1
  SessionRetentionSeconds:
    Type: Number
    Default: 86400
    MinValue: 1

Resources:
  TranslationStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # Trivy's CloudFormation parser does not read SqsManagedSseEnabled.
  # SSE-SQS is explicitly enabled below and enforced by the SAM template test.
  #trivy:ignore:AWS-0096
  RefinementDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true

  # Trivy's CloudFormation parser does not read SqsManagedSseEnabled.
  # SSE-SQS is explicitly enabled below and enforced by the SAM template test.
  #trivy:ignore:AWS-0096
  RefinementQueue:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt RefinementDeadLetterQueue.Arn
        maxReceiveCount: 3

  IngressFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: IngressDataAndProviders
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:TransactWriteItems
                Resource: !GetAtt TranslationStateTable.Arn
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt RefinementQueue.Arn
              - Effect: Allow
                Action: translate:TranslateText
                Resource: '*'

  RefineFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: RefineDataAndProviders
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                Resource: !GetAtt TranslationStateTable.Arn
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt RefinementQueue.Arn
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource: '*'

  IngressFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ..
      Handler: src/handlers/ingress-handler.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 512
      Timeout: 20
      Role: !GetAtt IngressFunctionRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref TranslationStateTable
          REFINEMENT_QUEUE_URL: !Ref RefinementQueue
          DRAFT_PROVIDER: !Ref DraftProvider
          REFINER_PROVIDER: !Ref RefinerProvider
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          CONTEXT_WINDOW_SIZE: !Ref ContextWindowSize
          SESSION_RETENTION_SECONDS: !Ref SessionRetentionSeconds
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/ingress-handler.ts
        Format: esm
        OutExtension:
          - .js=.mjs
        Banner:
          - 'js=import { createRequire } from "node:module"; const require = createRequire(import.meta.url);'
        Minify: true
        Sourcemap: false
        Target: es2024

  RefineFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ..
      Handler: src/handlers/refine-handler.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 512
      Timeout: 30
      Role: !GetAtt RefineFunctionRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref TranslationStateTable
          REFINEMENT_QUEUE_URL: !Ref RefinementQueue
          DRAFT_PROVIDER: !Ref DraftProvider
          REFINER_PROVIDER: !Ref RefinerProvider
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          CONTEXT_WINDOW_SIZE: !Ref ContextWindowSize
          SESSION_RETENTION_SECONDS: !Ref SessionRetentionSeconds
      Events:
        RefinementQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt RefinementQueue.Arn
            BatchSize: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/refine-handler.ts
        Format: esm
        OutExtension:
          - .js=.mjs
        Banner:
          - 'js=import { createRequire } from "node:module"; const require = createRequire(import.meta.url);'
        Minify: true
        Sourcemap: false
        Target: es2024

  TranslationWebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: $request.body.action

  IngressWebSocketIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref TranslationWebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationMethod: POST
      IntegrationUri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${IngressFunction.Arn}/invocations

  ConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref TranslationWebSocketApi
      RouteKey: $connect
      AuthorizationType: NONE
      Target: !Sub integrations/${IngressWebSocketIntegration}

  DisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref TranslationWebSocketApi
      RouteKey: $disconnect
      AuthorizationType: NONE
      Target: !Sub integrations/${IngressWebSocketIntegration}

  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref TranslationWebSocketApi
      RouteKey: $default
      AuthorizationType: NONE
      Target: !Sub integrations/${IngressWebSocketIntegration}

  SessionStartRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref TranslationWebSocketApi
      RouteKey: session.start
      AuthorizationType: NONE
      Target: !Sub integrations/${IngressWebSocketIntegration}

  TranscriptUpsertRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref TranslationWebSocketApi
      RouteKey: transcript.upsert
      AuthorizationType: NONE
      Target: !Sub integrations/${IngressWebSocketIntegration}

  TranslationWebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    DependsOn:
      - ConnectRoute
      - DisconnectRoute
      - DefaultRoute
      - SessionStartRoute
      - TranscriptUpsertRoute
      - IngressWebSocketPermission
    Properties:
      ApiId: !Ref TranslationWebSocketApi
      StageName: !Ref StageName
      AutoDeploy: true

  IngressWebSocketPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref IngressFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${TranslationWebSocketApi}/${StageName}/*

  WebSocketManageConnectionsPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub ${AWS::StackName}-manage-websocket-connections
      Roles:
        - !Ref IngressFunctionRole
        - !Ref RefineFunctionRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: execute-api:ManageConnections
            Resource: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${TranslationWebSocketApi}/${StageName}/POST/@connections/*

Outputs:
  WebSocketApiId:
    Value: !Ref TranslationWebSocketApi
  WebSocketUrl:
    Value: !Sub wss://${TranslationWebSocketApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${StageName}
  TranslationStateTableName:
    Value: !Ref TranslationStateTable
  RefinementQueueUrl:
    Value: !Ref RefinementQueue
  RefinementQueueArn:
    Value: !GetAtt RefinementQueue.Arn
  RefinementDeadLetterQueueUrl:
    Value: !Ref RefinementDeadLetterQueue
  IngressFunctionName:
    Value: !Ref IngressFunction
  RefineFunctionName:
    Value: !Ref RefineFunction
